name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev mypy src
      - run: uv run --frozen --extra dev pytest
      - run: uv run --frozen --extra dev pip-audit --local
      - run: uv build --python python
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Smoke test container
        shell: bash
        run: |
          token=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$token"
          export AMOS_API_TOKEN="$token"
          docker compose up -d --build
          trap 'docker compose down' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              curl --fail --silent -H "Authorization: Bearer $AMOS_API_TOKEN" -H "Content-Type: application/json" --data-binary @examples/brief.json http://127.0.0.1:8000/workflows/content | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "pending_approval"'
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
